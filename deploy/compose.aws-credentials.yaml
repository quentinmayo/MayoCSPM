# Optional for a non-AWS host. File is read-only, mounted only in the worker.
# Use an operator profile that can assume only your reviewed target roles.
services:
  worker:
    volumes:
      - ${AWS_CREDENTIALS_FILE:?Provide a private operator profile file}:/run/aws/credentials:ro
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_PROFILE: ${AWS_PROFILE:-mayocspm}
      AWS_EC2_METADATA_DISABLED: 'true'
